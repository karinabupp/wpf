<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Form — World Poker Federation</title>
<style>
  :root {
    --bg: #f5f4ee;
    --panel: #ffffff;
    --border: #dedcd2;
    --border-strong: #c4c2b6;
    --text: #2c2c2a;
    --text-muted: #77766f;
    --accent: #185fa5;
    --accent-dark: #0c447c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px 60px;
  }
  #page { width: 100%; max-width: 620px; }
  #form-logo { display: block; height: 52px; width: auto; margin: 0 auto 28px; }
  #form-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px 28px;
  }
  #form-title { font-size: 22px; font-weight: 800; margin: 0 0 8px; }
  #form-description { font-size: 14px; color: var(--text-muted); line-height: 1.5; margin: 0 0 28px; white-space: pre-wrap; }
  .fq { margin-bottom: 24px; }
  .fq-label { font-size: 14.5px; font-weight: 700; margin-bottom: 8px; display: block; }
  .fq-required { color: #a3312a; margin-left: 3px; }
  .fq-input, .fq-textarea, .fq-select {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: #ffffff;
  }
  .fq-textarea { min-height: 90px; resize: vertical; }
  .fq-choice-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 14px; }
  .fq-choice-row input { flex-shrink: 0; }
  .fq-file-input { font-size: 13px; }
  .fq-file-hint { font-size: 11.5px; color: var(--text-muted); margin-top: 4px; }
  .fq-error { font-size: 12px; color: #a3312a; margin-top: 5px; display: none; }
  .fq.has-error .fq-error { display: block; }
  .fq.has-error .fq-input, .fq.has-error .fq-textarea, .fq.has-error .fq-select { border-color: #a3312a; }
  #form-submit-btn {
    width: 100%;
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 9px;
    padding: 13px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
  }
  #form-submit-btn:hover { background: var(--accent-dark); }
  #form-submit-btn:disabled { opacity: 0.6; cursor: default; }
  #form-status { font-size: 13px; color: var(--text-muted); margin-top: 12px; text-align: center; min-height: 16px; }
  #form-thankyou { text-align: center; padding: 40px 10px; }
  #form-thankyou h2 { font-size: 20px; margin: 0 0 8px; }
  #form-thankyou p { color: var(--text-muted); font-size: 14px; }
  .hidden { display: none; }
  #form-loading, #form-notfound { text-align: center; padding: 60px 10px; color: var(--text-muted); font-size: 14px; }
</style>
</head>

    <div id="form-loading">Loading form…</div>
    <div id="form-notfound" class="hidden">This form doesn't exist or is no longer available.</div>
    <div id="form-content" class="hidden">
      <h1 id="form-title"></h1>
      <p id="form-description"></p>
      <form id="form-questions"></form>
      <button id="form-submit-btn" type="button">Submit responses</button>
      <div id="form-status"></div>
    </div>
    <div id="form-thankyou" class="hidden">
      <h2>Thank you! ✅</h2>
      <p>Your response has been recorded.</p>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ufwmktomjfcvloswgnyt.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmd21rdG9tamZjdmxvc3dnbnl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MjIyMDAsImV4cCI6MjEwMDM5ODIwMH0.NAhI21Vs1aYqJQ_P9QAVTsRQWr_8bYlaE1fPg2KS-mg";
const FORMS_TABLE_URL = `${SUPABASE_URL}/rest/v1/wpf_forms`;
const FORM_RESPONSES_TABLE_URL = `${SUPABASE_URL}/rest/v1/wpf_form_responses`;
const MAX_ATTACHMENT_BYTES = 5 * 1024 * 1024; // 5MB — stored inline as base64, keep it modest

const params = new URLSearchParams(window.location.search);
const formId = params.get("id");

let currentForm = null;

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function renderQuestion(q) {
  const wrap = document.createElement("div");
  wrap.className = "fq";
  wrap.dataset.qid = q.id;

  const label = document.createElement("label");
  label.className = "fq-label";
  label.innerHTML = q.label + (q.required ? '<span class="fq-required">*</span>' : "");
  wrap.appendChild(label);

  if (q.type === "text") {
    const input = document.createElement("textarea");
    input.className = "fq-textarea";
    input.dataset.qid = q.id;
    wrap.appendChild(input);
  } else if (q.type === "multiple_choice") {
    (q.options || []).forEach((opt, i) => {
      const row = document.createElement("label");
      row.className = "fq-choice-row";
      row.innerHTML = `<input type="radio" name="q_${q.id}" value="${(opt || "").replace(/"/g, "&quot;")}" data-qid="${q.id}"> <span>${opt}</span>`;
      wrap.appendChild(row);
    });
  } else if (q.type === "single_select") {
    const select = document.createElement("select");
    select.className = "fq-select";
    select.dataset.qid = q.id;
    select.innerHTML = `<option value="">Select…</option>` + (q.options || []).map(opt => `<option value="${(opt || "").replace(/"/g, "&quot;")}">${opt}</option>`).join("");
    wrap.appendChild(select);
  } else if (q.type === "checkbox") {
    (q.options || []).forEach((opt, i) => {
      const row = document.createElement("label");
      row.className = "fq-choice-row";
      row.innerHTML = `<input type="checkbox" value="${(opt || "").replace(/"/g, "&quot;")}" data-qid="${q.id}"> <span>${opt}</span>`;
      wrap.appendChild(row);
    });
  } else if (q.type === "attachment") {
    const input = document.createElement("input");
    input.type = "file";
    input.className = "fq-file-input";
    input.dataset.qid = q.id;
    wrap.appendChild(input);
    const hint = document.createElement("div");
    hint.className = "fq-file-hint";
    hint.textContent = "Up to 5MB.";
    wrap.appendChild(hint);
  }

  const err = document.createElement("div");
  err.className = "fq-error";
  err.textContent = "This question is required.";
  wrap.appendChild(err);

  return wrap;
}

async function loadForm() {
  if (!formId) {
    document.getElementById("form-loading").classList.add("hidden");
    document.getElementById("form-notfound").classList.remove("hidden");
    return;
  }
  try {
    const res = await fetch(`${FORMS_TABLE_URL}?id=eq.${encodeURIComponent(formId)}&select=*`, {
      headers: { "apikey": SUPABASE_ANON_KEY, "Authorization": `Bearer ${SUPABASE_ANON_KEY}` }
    });
    const rows = res.ok ? await res.json() : [];
    const form = rows[0];
    if (!form || form.status !== "published") {
      document.getElementById("form-loading").classList.add("hidden");
      document.getElementById("form-notfound").classList.remove("hidden");
      return;
    }
    currentForm = form;
    document.getElementById("form-title").textContent = form.title || "";
    document.getElementById("form-description").textContent = form.description || "";
    document.getElementById("form-description").style.display = form.description ? "" : "none";
    const container = document.getElementById("form-questions");
    (form.questions || []).forEach(q => container.appendChild(renderQuestion(q)));
    document.getElementById("form-loading").classList.add("hidden");
    document.getElementById("form-content").classList.remove("hidden");
  } catch (err) {
    document.getElementById("form-loading").classList.add("hidden");
    document.getElementById("form-notfound").classList.remove("hidden");
  }
}

async function collectAnswers() {
  const answers = {};
  let hasError = false;
  for (const q of (currentForm.questions || [])) {
    const wrap = document.querySelector(`.fq[data-qid="${q.id}"]`);
    wrap.classList.remove("has-error");
    let value = null;

    if (q.type === "text") {
      value = wrap.querySelector("textarea").value.trim();
    } else if (q.type === "multiple_choice") {
      const checked = wrap.querySelector(`input[type="radio"]:checked`);
      value = checked ? checked.value : "";
    } else if (q.type === "single_select") {
      value = wrap.querySelector("select").value;
    } else if (q.type === "checkbox") {
      const checked = Array.from(wrap.querySelectorAll(`input[type="checkbox"]:checked`)).map(i => i.value);
      value = checked;
    } else if (q.type === "attachment") {
      const fileInput = wrap.querySelector('input[type="file"]');
      const file = fileInput.files[0];
      if (file) {
        if (file.size > MAX_ATTACHMENT_BYTES) {
          wrap.classList.add("has-error");
          wrap.querySelector(".fq-error").textContent = "File too large (max 5MB).";
          hasError = true;
          continue;
        }
        const dataUrl = await fileToDataUrl(file);
        value = { name: file.name, size: file.size, dataUrl };
      } else {
        value = null;
      }
    }

    const isEmpty = value === null || value === "" || (Array.isArray(value) && value.length === 0);
    if (q.required && isEmpty) {
      wrap.classList.add("has-error");
      wrap.querySelector(".fq-error").textContent = "This question is required.";
      hasError = true;
      continue;
    }
    answers[q.id] = value;
  }
  return { answers, hasError };
}

document.getElementById("form-submit-btn").addEventListener("click", async () => {
  const btn = document.getElementById("form-submit-btn");
  const statusEl = document.getElementById("form-status");
  btn.disabled = true;
  statusEl.textContent = "Sending…";
  try {
    const { answers, hasError } = await collectAnswers();
    if (hasError) {
      statusEl.textContent = "Check the questions marked in red.";
      btn.disabled = false;
      return;
    }
    const res = await fetch(FORM_RESPONSES_TABLE_URL, {
      method: "POST",
      headers: {
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "return=minimal"
      },
      body: JSON.stringify([{ form_id: currentForm.id, answers, submitted_at: new Date().toISOString() }])
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    document.getElementById("form-content").classList.add("hidden");
    document.getElementById("form-thankyou").classList.remove("hidden");
  } catch (err) {
    statusEl.textContent = "⚠️ Couldn't send — check your connection and try again.";
    btn.disabled = false;
  }
});

loadForm();
</script>
